<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details — RTN BACKUP GROUP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/meta-ai-logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff1e42">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body data-page="marketplace">

  <div class="page">
    <div class="flex ac jb mb16">
      <a href="index.html" class="muted fs13" id="backLink" style="display:inline-flex; align-items:center; gap:6px;">
        ← Back to Marketplace
      </a>
      <span class="badge red no-dot">RTN Escrow Protected</span>
    </div>

    <div class="grid-sidebar mt16" id="productWrap">
      <!-- filled by JS -->
    </div>

    <!-- Seller card + reviews -->
    <div class="grid-2 mt24">
      <div class="card glow-card" id="reviewsCard">
        <div class="card__head">
          <div>
            <h3>Buyer Reviews & Ratings</h3>
            <div class="sub">Verified post-order ratings from genuine buyers</div>
          </div>
          <button class="btn btn-ghost btn-sm" id="writeReviewBtn">✍️ Write a Review</button>
        </div>
        <div class="card__body">
          <div class="review-summary" id="reviewSummary"></div>
          <div class="review-list" id="reviewList"></div>
        </div>
      </div>

      <div>
        <div class="card glow-card mb24" id="sellerCard">
          <div class="card__head">
            <div>
              <h3>Verified Seller Information</h3>
              <div class="sub">Identity & WhatsApp Verified by Admin</div>
            </div>
          </div>
          <div class="card__body" id="sellerBody"></div>
        </div>

        <div class="card glow-card">
          <div class="card__head">
            <div><h3>Similar Listings</h3></div>
          </div>
          <div class="card__body" id="similarList" style="display:flex; flex-direction:column; gap:12px;"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/product.js"></script>
</body>
</html>
